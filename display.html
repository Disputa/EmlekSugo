<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmlékSúgó Display</title>
    <script type="module" src="/src/display.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="windowControls" aria-label="Ablak vezérlők">
        <button id="displayMinimizeBtn" class="window-control-btn" type="button" title="Tálcára rejtés">_</button>
        <button id="displayToggleWindowBtn" class="window-control-btn" type="button" title="Ablak / teljes képernyő">□</button>
        <button id="displayCloseBtn" class="window-control-btn close" type="button" title="Bezárás">×</button>
      </div>

      <div id="topbar">
        <div>
          <div id="songTitle"></div>
          <div id="role"></div>
        </div>
        <div id="overlay"></div>
      </div>

      <div id="showList"></div>
      <div id="blockRail"></div>

      <div id="contentWrap">
        <div id="content"></div>
      </div>

      <div id="transportHud"></div>
      <div id="credit">created by: Deme Gábor © 2026 — only use for Szolnoki Szigligeti Theater</div>
    </div>

</body>
</html>
