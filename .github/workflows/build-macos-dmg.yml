name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  macos-arm64:
    name: macOS DMG Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Apple Silicon DMG
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: EmlékSúgó-2.5.4-macOS-arm64-DMG
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  macos-intel:
    name: macOS DMG Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Intel DMG
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: EmlékSúgó-2.5.4-macOS-intel-DMG
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
